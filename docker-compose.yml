x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  S3_ENDPOINT: minio:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  S3_BUCKET: ${S3_BUCKET:-products}
  MEDIA_PUBLIC_URL: ${PUBLIC_URL}/media
  INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}

x-bot-env: &bot-env
  BOT_TOKEN: ${BOT_TOKEN}
  ADMIN_IDS: ${ADMIN_IDS}
  WEBHOOK_BASE_URL: ${PUBLIC_URL}
  WEBHOOK_PATH: ${WEBHOOK_PATH:-/tg/webhook}
  WEBHOOK_SECRET: ${WEBHOOK_SECRET}
  WEBAPP_URL: ${PUBLIC_URL}/
  BACKEND_URL: http://nginx
  INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    # Official minio/minio images are no longer published on Docker Hub;
    # pgsty/minio is a community build of the same upstream source (includes mc).
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-products}
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${S3_BUCKET} &&
      mc anonymous set download local/$${S3_BUCKET}
      "

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend
    environment: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    deploy:
      replicas: ${BACKEND_REPLICAS:-2}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  bot:
    build: ./bot
    environment: *bot-env
    depends_on:
      - backend
    deploy:
      replicas: ${BOT_REPLICAS:-2}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # One-shot: registers the webhook once instead of every replica racing on startup.
  bot-webhook:
    build: ./bot
    command: ["python", "-m", "app.main", "set-webhook"]
    environment: *bot-env
    depends_on:
      - nginx

  frontend:
    build: ./frontend
    environment:
      API_INTERNAL_URL: http://nginx
    deploy:
      replicas: ${FRONTEND_REPLICAS:-2}
    restart: unless-stopped

  nginx:
    image: nginx:1.27.3-alpine
    environment:
      S3_BUCKET: ${S3_BUCKET:-products}
      WEBHOOK_PATH: ${WEBHOOK_PATH:-/tg/webhook}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
    depends_on:
      - minio
    ports:
      - "${HTTP_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
