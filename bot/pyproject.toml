# Lint and type-check settings (dependencies live in requirements.txt).

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I", "ASYNC", "SIM", "RUF"]
# Russian user-facing strings are not "ambiguous" characters.
ignore = ["RUF001"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
ignore_missing_imports = true

[tool.ruff.lint.isort]
known-first-party = ["app"]
